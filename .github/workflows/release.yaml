# Builds every PostgreSQL version under binaries/ for every platform we ship,
# smoke-tests each tarball, and publishes them all as one release when a merge
# to master names a RELEASE_VERSION that has no release yet. A release is only
# created when every build and test passed, so it never carries one platform
# without the other.
#
# Only what changed is rebuilt. Each (version, platform) job asks Please, on
# its own platform, whether that version's targets changed since the latest
# release (`plz query changes`, which compares the rules at both commits). A
# platform whose rules did not change takes its tarballs from that release, so
# a macOS-only change never rebuilds Linux, and a new release carries the same
# Linux binaries as the last. What did change is built, and cached under the
# hash of everything that decides its binaries: GitHub scopes caches by
# branch, so a PR sees master's caches but master never sees a PR's, and a
# version a PR changes is built once on the PR (to verify it) and once on
# master (to publish it). Reused or built, every tarball is smoke-tested.
#
# Platforms:
#   linux_x86_64  ubuntu-24.04  pinned: the binaries link the runner's libicu
#                               (74) and glibc (2.38), so they run on Ubuntu
#                               24.04 or newer; moving the runner moves that
#   darwin_arm64  macos-15      Apple Silicon; the binaries load only macOS's
#                               own libraries (ICU is built from source and
#                               linked in statically), never Homebrew's
#
# To release: bump RELEASE_VERSION in build_defs/postgres.build_defs and merge.
name: Release binaries

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its previous run (macOS runners are scarce);
# master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "versions=$(ls binaries | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.version }} (${{ matrix.runner }})
    env:
      TARGET: ${{ matrix.runner == 'macos-15' && 'darwin_arm64' || 'linux_x86_64' }}
    steps:
      # Full history and tags: `plz query changes` reads the latest release's
      # commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse the latest release's tarballs if nothing changed
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ matrix.version }}"
          VERSION="${VERSION#v}"
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          # Captured first: piped straight into grep -q, plz would die of
          # SIGPIPE on a match and pipefail would read "changed" as unchanged.
          CHANGES=$(./pleasew query changes --since "$LATEST" --level=-1)
          if grep -q "^//binaries/${{ matrix.version }}:" <<< "$CHANGES"; then
            echo "${{ matrix.version }} changed on $TARGET since $LATEST: building it."
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p dist
          if gh release download "$LATEST" --repo "$GITHUB_REPOSITORY" --dir dist \
              --pattern "psql-$VERSION-$TARGET.tar.gz" --pattern "psql-ai-$VERSION-$TARGET.tar.gz" \
              && [[ -f "dist/psql-$VERSION-$TARGET.tar.gz" && -f "dist/psql-ai-$VERSION-$TARGET.tar.gz" ]]; then
            echo "${{ matrix.version }} is unchanged on $TARGET since $LATEST: reusing its tarballs."
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "$LATEST has no $TARGET tarballs for ${{ matrix.version }}: building it."
            rm -rf dist
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      # Everything that decides this version's binaries on this platform.
      - name: Restore this version's build
        if: steps.reuse.outputs.reuse != 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: psql-${{ matrix.runner }}-${{ matrix.version }}-${{ hashFiles(format('binaries/{0}/**', matrix.version), 'build_defs/**', 'plugins/**', '.plzconfig', 'pleasew', 'release/smoke_test.sh', '.github/workflows/release.yaml') }}

      # Also needed when nothing is built: the smoke test runs the binaries,
      # and the Linux ones load the runner's libicu, libreadline and libuuid.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential flex bison perl pkg-config \
            libicu-dev libreadline-dev zlib1g-dev uuid-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Xcode 16.2 (macOS SDK 15.2), as the binaries were built with on
          # macos-14. The image's default SDK (15.4) declares strchrnul, which
          # PostgreSQL releases before 16.9 and 17.5 then use unguarded and
          # fail to compile.
          # Nothing from Homebrew: ICU is built from source by
          # postgres.build_defs, and psql uses the system libedit.
          sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build
        if: steps.reuse.outputs.reuse != 'true' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Retries only network failures (40+ jobs downloading at once from
          # GitHub sometimes exhaust plz's own retries); a compile error or a
          # 404 fails at once. plz-out keeps every target that already built,
          # so a retry only redoes what failed.
          TRANSIENT='giving up after [0-9]+ attempt|connection reset by peer|TLS handshake timeout|i/o timeout|unexpected EOF|Could not resolve host'
          for attempt in 1 2 3; do
            set +e
            ./pleasew build //binaries/${{ matrix.version }}/... 2>&1 | tee "$RUNNER_TEMP/build.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              mkdir -p dist
              cp $(./pleasew query output //binaries/${{ matrix.version }}/... | grep 'psql-.*\.tar\.gz$') dist/
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]] || ! grep -qE "$TRANSIENT" "$RUNNER_TEMP/build.log"; then
              exit "$status"
            fi
            echo "::warning::Build attempt $attempt failed on a network error; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          tarballs=(dist/psql-*.tar.gz)
          if [[ "${#tarballs[@]}" -ne 2 || ! -e "${tarballs[0]}" ]]; then
            echo "expected a base and an AI tarball in dist/, found: ${tarballs[*]}"
            exit 1
          fi
          for tarball in "${tarballs[@]}"; do
            case "$(basename "$tarball")" in
              (psql-ai-*) variant=ai ;;
              (*) variant=base ;;
            esac
            release/smoke_test.sh "$tarball" "$variant"
          done

      # Saved only after the smoke test passed, so the cache never holds a
      # build that failed it.
      - name: Save this version's build
        if: steps.reuse.outputs.reuse != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: psql-${{ matrix.version }}-${{ matrix.runner }}
          path: dist/psql-*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Is RELEASE_VERSION unreleased?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=$(sed -n 's/^RELEASE_VERSION = "\(.*\)"$/\1/p' build_defs/postgres.build_defs)
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "no RELEASE_VERSION in build_defs/postgres.build_defs"
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$RELEASE_VERSION is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tagged at this merge commit: the release is exactly what was built
          # and smoke-tested from it.
          gh release create "$RELEASE_VERSION" dist/psql-*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "PostgreSQL Release $RELEASE_VERSION" \
            --notes "PostgreSQL binaries for linux_x86_64 and darwin_arm64, built and smoke-tested by the Release binaries workflow from $GITHUB_SHA."

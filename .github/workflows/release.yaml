# Builds every PostgreSQL version under binaries/ for every platform we ship,
# smoke-tests each tarball, and on a version tag publishes them all as one
# release. A release is only created when every build and test passed, so a
# release never carries one platform without the other.
#
# Platforms:
#   linux_x86_64  ubuntu-24.04  pinned: the binaries link the runner's libicu
#                               (74) and glibc (2.38), so they run on Ubuntu
#                               24.04 or newer; moving the runner moves that
#   darwin_arm64  macos-14      Apple Silicon
#
# To release: bump RELEASE_VERSION in build_defs/postgres.build_defs, merge,
# then push the matching tag (git tag v0.0.N && git push origin v0.0.N).
name: Release binaries

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its previous run (macOS runners are scarce);
# master and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "versions=$(ls binaries | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.version }} (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential flex bison perl pkg-config \
            libicu-dev libreadline-dev zlib1g-dev uuid-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install icu4c readline pkgconf
          # postgres.build_defs finds them at these paths; fail here, not mid-configure
          test -d /opt/homebrew/opt/icu4c/lib/pkgconfig
          test -d /opt/homebrew/opt/readline/lib/pkgconfig

      - name: Build
        shell: bash
        run: |
          # Retries only network failures (40+ jobs downloading at once from
          # GitHub sometimes exhaust plz's own retries); a compile error or a
          # 404 fails at once. plz-out keeps every target that already built,
          # so a retry only redoes what failed.
          TRANSIENT='giving up after [0-9]+ attempt|connection reset by peer|TLS handshake timeout|i/o timeout|unexpected EOF|Could not resolve host'
          for attempt in 1 2 3; do
            set +e
            ./pleasew build //binaries/${{ matrix.version }}/... 2>&1 | tee "$RUNNER_TEMP/build.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]] || ! grep -qE "$TRANSIENT" "$RUNNER_TEMP/build.log"; then
              exit "$status"
            fi
            echo "::warning::Build attempt $attempt failed on a network error; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          for tarball in $(./pleasew query output //binaries/${{ matrix.version }}/... | grep 'psql-.*\.tar\.gz$'); do
            case "$(basename "$tarball")" in
              psql-ai-*) variant=ai ;;
              *) variant=base ;;
            esac
            release/smoke_test.sh "$tarball" "$variant"
            cp "$tarball" "$RUNNER_TEMP/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: psql-${{ matrix.version }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/psql-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches RELEASE_VERSION
        run: |
          RELEASE_VERSION=$(sed -n 's/^RELEASE_VERSION = "\(.*\)"$/\1/p' build_defs/postgres.build_defs)
          if [[ "$RELEASE_VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match RELEASE_VERSION $RELEASE_VERSION in build_defs/postgres.build_defs"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/psql-*.tar.gz \
            --title "PostgreSQL Release $GITHUB_REF_NAME" \
            --notes "PostgreSQL binaries for linux_x86_64 and darwin_arm64, built and smoke-tested by the Release binaries workflow."
